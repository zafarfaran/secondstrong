<meta charset="utf-8">
<title>Collage Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Gochi+Hand&family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: a quiet desk. Left, five onboarding experiences in the Sketchbook look; right, one live phone running the chosen one. */
:root{
  --bg:#FBF8F4; --card:#F6F0E8; --almond:#EDE3D6; --ink:#3B322C; --ink2:#5D534B;
  --taupe:#A8968A; --terra:#A85A3C; --apricot:#F0C9A8; --edge:rgba(59,50,44,.10); --shadow:rgba(59,50,44,.22);
  --desk:#EFE8DE; --deskInk:#3B322C; --deskInk2:#6E6158;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-serif:"Newsreader", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Gochi Hand", "Comic Sans MS", cursive;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
  --spring-soft:linear(0, .02 1.5%, .1 4%, .38 10%, .72 18%, .92 26%, 1.02 34%, 1.05 40%, 1.04 48%, 1.01 60%, 1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --desk:#1C1714; --deskInk:#F1E9DF; --deskInk2:#B8AA9D; color-scheme:dark }}
:root[data-theme="dark"]{ --desk:#1C1714; --deskInk:#F1E9DF; --deskInk2:#B8AA9D; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--desk); color:var(--deskInk); font:400 16px/1.45 var(--f-display); margin:0}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--terra); outline-offset:3px}
.wrap{max-width:1120px; margin:0 auto; padding-inline:clamp(16px,3vw,40px); padding-block:32px 48px; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:48px; align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr); gap:24px} }
.side{position:sticky; top:32px; display:grid; gap:18px}
@media (max-width:900px){ .side{position:static} }
.dmeta{font:500 12px/1.2 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--deskInk2)}
.side h1{font:800 clamp(30px,4vw,44px)/1.02 var(--f-display); letter-spacing:-.035em; margin:0; text-wrap:balance}
.side h1 em{font-family:var(--f-serif); font-style:italic; font-weight:400}
.side .lede{margin:0; color:var(--deskInk2); max-width:52ch}
.vlist{display:grid; gap:8px; margin:6px 0 0; padding:0; list-style:none}
.vbtn{appearance:none; width:100%; text-align:left; border:1.5px solid color-mix(in srgb,var(--deskInk) 14%,transparent); background:transparent; border-radius:16px; padding:12px 14px; cursor:pointer; display:grid; grid-template-columns:30px 1fr; gap:2px 12px; align-items:start; transition:border-color 160ms, background 160ms}
.vbtn:hover{border-color:color-mix(in srgb,var(--deskInk) 35%,transparent)}
.vbtn[aria-pressed="true"]{border-color:var(--deskInk); background:color-mix(in srgb,var(--deskInk) 6%,transparent)}
.vbtn .ltr{grid-row:span 2; font:400 26px/1 var(--f-hand); color:var(--terra)}
.vbtn b{font:800 16px/1.15 var(--f-display)}
.vbtn span{font-size:13.5px; color:var(--deskInk2); line-height:1.35}
.tip{font:500 11px/1.4 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--deskInk2); margin:0}
.phone-col{display:grid; justify-items:center; gap:12px}
.phone{position:relative; width:min(100%,390px); height:800px; border-radius:46px; background:#2A231F; padding:10px; box-shadow:0 30px 60px -20px rgba(40,30,20,.45), 0 0 0 1px rgba(0,0,0,.2)}
.page{position:relative; width:100%; height:100%; border-radius:37px; background:var(--bg); color:var(--ink); overflow:hidden; isolation:isolate}
.page::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 31px, rgba(59,50,44,.04) 31px 32px); pointer-events:none}
.replay{appearance:none; border:0; background:transparent; font:500 11px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--deskInk2); cursor:pointer; padding:8px 10px; border-radius:8px}
.root{position:absolute; inset:0}

/* shared pieces */
.meta{font:500 11.5px/1.2 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase}
.title{font:800 34px/1.02 var(--f-display); letter-spacing:-.035em; margin:0; text-wrap:balance}
.title em{font-family:var(--f-serif); font-style:italic; font-weight:400; letter-spacing:-.015em}
.btn{appearance:none; border:0; height:54px; border-radius:99px; background:var(--ink); color:var(--bg); font:600 16.5px/1 var(--f-display); cursor:pointer; width:100%; transition:transform 160ms var(--ease), opacity 380ms; position:relative; z-index:3}
.btn:active{transform:scale(.97)}
.btn[aria-disabled="true"]{opacity:.3; cursor:default}
.btn.small{height:44px; font-size:15px; width:auto; padding:0 20px}
.coach{position:absolute; pointer-events:none}
.coach .m{width:100%; height:100%; display:block}
.coach .swap{animation:swap 460ms var(--spring) both}
@keyframes swap{from{transform:scale(.82) translateY(10px)} to{transform:none}}
.ink{position:absolute; left:0; top:0; pointer-events:none; overflow:visible; mix-blend-mode:multiply; z-index:4}
.ink path{fill:none; stroke-linecap:round; stroke-linejoin:round}
.fade{transition:opacity 360ms var(--ease); opacity:0!important}
.glyph{width:40px; height:36px; overflow:visible}
.glyph path{fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.draw{background:currentColor; -webkit-mask:var(--src) center / contain no-repeat; mask:var(--src) center / contain no-repeat}
.sketch{animation:sketch 1000ms var(--ease) both}
@keyframes sketch{from{clip-path:polygon(0 0,0 0,0 0)} to{clip-path:polygon(0 0,250% 0,0 250%)}}
.thumbs{display:flex; gap:7px}
.thumb{appearance:none; flex:1 1 0; min-width:0; aspect-ratio:1; border-radius:14px; border:1px solid var(--edge); background:var(--card); padding:2px; cursor:pointer; transition:transform 200ms var(--ease)}
.thumb:active{transform:scale(.94)}
.thumb .m{width:100%; height:100%; display:block}
.thumb[aria-checked="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.field{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding:4px 2px 6px}
.field label{font:500 11px/1 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; flex:none}
.field input{flex:1; min-width:0; border:0; background:transparent; font:800 24px/1.1 var(--f-display); letter-spacing:-.02em; padding:2px 0; outline:none}
.chipx{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent); background:var(--card); border-radius:16px; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; font:700 14px/1.1 var(--f-display); transition:transform 160ms var(--ease), border-color 200ms, background 200ms}
.chipx:active{transform:scale(.95)}
.chipx[aria-checked="true"]{border-color:var(--ink); background:var(--bg)}
.chipx .glyph{width:28px; height:26px}
.chipx .draw{width:34px; height:34px}
.dayrow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.dayb{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 16%,transparent); background:transparent; border-radius:14px; height:50px; cursor:pointer; font:600 14px/1 var(--f-display); transition:background 160ms, color 160ms, transform 160ms var(--ease)}
.dayb:active{transform:scale(.93)}
.dayb[aria-checked="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); animation:stamp 380ms var(--spring)}
@keyframes stamp{0%{transform:scale(.94)} 100%{transform:scale(1)}}
.wk{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center}
.wk span{font:500 10px/1 var(--f-mono); color:var(--ink2)}
.wk i{display:block; height:28px; margin-top:6px; border-radius:10px; background:rgba(59,50,44,.07); transform:scale(.5); opacity:0; animation:pop 420ms var(--spring) forwards}
.wk i.on{background:var(--ink)}
@keyframes pop{to{transform:scale(1); opacity:1}}
.plancard{background:var(--card); border:1px solid var(--edge); border-radius:20px; padding:14px 16px; display:grid; gap:12px}
.plancard .num{font:800 54px/.9 var(--f-display); letter-spacing:-.05em}
.plancard .num small{font-size:22px}
.plancard .row{display:flex; align-items:end; justify-content:space-between; gap:10px}
.plancard .lab{font:500 10.5px/1.3 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase}
.plancard .draw{width:80px; height:80px; color:var(--ink)}
.hand{font:400 21px/1.2 var(--f-hand); color:var(--terra)}

/* ===== A · conversation ===== */
.cv{display:flex; flex-direction:column; padding-top:34px}
.cv-head{display:flex; gap:10px; align-items:center; padding:6px 18px 10px; border-bottom:1px solid var(--edge); position:relative; z-index:2; background:var(--bg)}
.cv-av{position:relative; width:58px; height:58px; flex:none}
.cv-av .coach{inset:-6px; width:auto; height:auto}
.cv-head b{display:block; font:800 17px/1.1 var(--f-display)}
.cv-head span{font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
.cv-log{flex:1; overflow-y:auto; padding:18px 20px 12px; display:flex; flex-direction:column; gap:12px; scrollbar-width:none}
.cv-log::-webkit-scrollbar{display:none}
.line{font:400 22px/1.2 var(--f-hand); color:var(--terra); max-width:88%}
.line.writing{animation:write var(--d,800ms) var(--st,steps(20)) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 -10% 0 0)}}
.me{align-self:flex-end; background:var(--almond); border-radius:18px 18px 6px 18px; padding:9px 14px; font:600 15px/1.25 var(--f-display); max-width:80%}
.typing{display:flex; gap:4px; padding:6px 2px}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--terra); opacity:.4; animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0); opacity:.35} 40%{transform:translateY(-4px); opacity:1}}
.cv-tray{padding:14px 16px 20px; border-top:1px solid var(--edge); background:var(--bg); min-height:96px; display:grid; gap:10px; align-content:end; position:relative; z-index:2}
.cv-tray .opts{display:flex; flex-wrap:wrap; gap:7px}
.rise{animation:rise 380ms var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}

/* ===== B · toybox ===== */
.tb-head{position:absolute; left:22px; right:110px; top:96px}
.tb-head .title{transition:none}
.stampin{animation:stampin 460ms var(--spring) both}
@keyframes stampin{from{transform:scale(1.25) rotate(-2deg); opacity:0}}
.toy{position:absolute; width:76px; height:76px; border-radius:50%; background:#FFFDF9; border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent); box-shadow:0 8px 16px -10px rgba(59,50,44,.45); display:grid; place-items:center; align-content:center; gap:2px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none}
.toy:active{cursor:grabbing}
.toy b{font:700 10.5px/1 var(--f-display); text-align:center; max-width:66px}
.toy .glyph{width:32px; height:28px}
.toy .draw{width:44px; height:44px; color:var(--ink)}
.toy.day{width:56px; height:56px; font:800 18px/1 var(--f-display)}
.toy .float{display:contents}
.toy.idle{animation:bob var(--bd,3.6s) ease-in-out var(--bdl,0s) infinite}
@keyframes bob{0%,100%{translate:0 0} 50%{translate:0 -6px}}
.toy.in{box-shadow:0 3px 6px -4px rgba(59,50,44,.45)}
.bowl{position:absolute; overflow:visible}
.bowl path{fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round}
.bowl.wobble{animation:wobble 500ms var(--ease)}
@keyframes wobble{25%{rotate:-4deg} 60%{rotate:3deg} 85%{rotate:-1deg}}
.floor{position:absolute; left:0; overflow:visible}
.floor path{fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; opacity:.5}
.tb-coach{position:absolute; left:0; top:0; transform-origin:0 0; transition:transform 760ms var(--spring-soft); pointer-events:auto; cursor:pointer}
.tb-coach .m{width:100%; height:100%; display:block}
.tb-foot{position:absolute; left:22px; right:22px; bottom:22px; display:grid; gap:10px}

/* ===== C · one drawing ===== */
.world{position:absolute; left:0; top:0; transform-origin:0 0}
.region{position:absolute; padding:96px 22px 22px; display:flex; flex-direction:column; gap:16px}
.region .lbl{position:absolute; left:22px; top:58px; font:400 18px/1 var(--f-hand); color:var(--taupe)}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent); background:transparent; border-radius:20px; padding:12px 10px 10px; cursor:pointer; display:grid; justify-items:center; gap:6px; transition:transform 160ms var(--ease), border-color 300ms}
.tile:active{transform:scale(.96)}
.tile b{font:700 14px/1.1 var(--f-display); position:relative; z-index:1}
.tile .glyph{width:44px; height:40px}
.tile .draw{width:76px; height:76px; color:var(--ink)}
.tile.wide{grid-column:1 / -1; grid-template-columns:auto auto; justify-content:center; align-items:center}
.tile[aria-checked="true"]{border-color:var(--ink); animation:stamp 420ms var(--spring)}
.cam-coach{position:absolute; width:180px; height:180px; transform-origin:0 0; transition:transform 760ms var(--spring-soft), opacity 300ms}
.spacer{flex:1}

/* ===== D · index cards ===== */
.ic-card{position:absolute; left:18px; right:18px; top:132px; bottom:22px; background:#FFFDF9; border-radius:22px; border:1px solid var(--edge); box-shadow:0 18px 36px -24px rgba(59,50,44,.5); padding:26px 20px 20px; display:flex; flex-direction:column; gap:16px; touch-action:pan-y; user-select:none; -webkit-user-select:none; overflow:hidden}
.ic-card::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 31px, rgba(168,90,60,.07) 31px 32px); pointer-events:none}
.ic-card::after{content:""; position:absolute; top:0; bottom:0; left:46px; width:1.5px; background:rgba(168,90,60,.16); pointer-events:none}
.ic-card > *{position:relative; z-index:1}
.ic-card .hint{font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--taupe); text-align:center}
.ic-coach{position:absolute; width:120px; height:120px; left:50%; top:30px; margin-left:-60px; z-index:5; transition:transform 500ms var(--spring)}

/* ===== E · collage ===== */
.cl-page{position:absolute; left:12px; right:12px; top:44px; height:404px; background:#FFFDF9; border-radius:24px; border:1px solid var(--edge); box-shadow:0 14px 30px -24px rgba(59,50,44,.45); overflow:hidden; transition:height 760ms var(--ease)}
.cl-page::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 31px, rgba(59,50,44,.05) 31px 32px)}
.cl-page > *{position:absolute}
.cl-title{left:18px; top:12px; font:400 30px/1 var(--f-hand); color:var(--ink)}
.slot{border:1.5px dashed color-mix(in srgb,var(--ink) 16%,transparent); border-radius:16px; transition:opacity 300ms}
.sticker{background:#fff; border-radius:16px; padding:6px; box-shadow:0 8px 16px -8px rgba(59,50,44,.45); display:grid; place-items:center; gap:2px}
.sticker::before{content:""; position:absolute; top:-9px; left:50%; width:46px; height:16px; margin-left:-23px; background:rgba(240,201,168,.75); transform:rotate(-4deg) scaleX(var(--tape,1)); transform-origin:left; transition:transform 260ms var(--ease) 180ms}
.sticker b{font:700 11px/1 var(--f-display); text-align:center}
.sticker .glyph{width:40px; height:36px}
.sticker .draw{width:70px; height:70px; color:var(--ink)}
.slap{animation:slap 420ms var(--spring) both}
@keyframes slap{0%{scale:1.18} 100%{scale:1}}
.peel{animation:peel 420ms var(--ease) forwards}
@keyframes peel{to{transform:translate(30px,60px) rotate(24deg); opacity:0}}
.cl-cal{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font:400 22px/1 var(--f-hand); color:var(--ink)}
.cl-tray{position:absolute; left:0; right:0; bottom:0; top:460px; padding:4px 22px 22px; display:flex; flex-direction:column; gap:12px; transition:transform 600ms var(--ease)}
.cl-tray.gone{transform:translateY(110%)}
.cl-tray .opts{display:flex; flex-wrap:wrap; gap:7px}
.coach-in .m{width:100%; height:100%; display:block}
.cl-date{left:18px; top:14px; font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
.cl-title{left:18px; top:30px; font:400 32px/1 var(--f-hand)!important; color:var(--ink)!important; max-width:none!important}
.preview{transition:opacity 200ms}
.pv-num{font:800 38px/.9 var(--f-display); letter-spacing:-.05em}
.pv-num small{font-size:16px}
.pv-label{align-content:center}
.pv-note{font-size:19px; line-height:1.05; transform:rotate(-3deg)}
.cl-cal span{transition:color 200ms, transform 200ms}
.cl-cal span.picked{color:var(--terra); transform:scale(1.15)}


__MASCOT_CSS__
.m .look{translate:var(--lx,0px) var(--ly,0px); transition:transform .35s ease, translate .14s linear}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:1ms!important; animation-delay:0ms!important; transition-duration:1ms!important}
}
</style>

<div class="wrap">
  <div class="side">
    <div class="dmeta">Second Strong · onboarding · Sketchbook</div>
    <h1>The <em>collage,</em> two ways.</h1>
    <p class="lede">A new start page that previews the page you are about to make, then the build. Compare it plain and with one continuous line.</p>
    <ul class="vlist" id="vlist"></ul>
    <p class="tip">The phone restarts when you switch</p>
  </div>
  <div class="phone-col">
    <div class="phone"><div class="page" id="page"></div></div>
    <button class="replay" id="replay" type="button">Replay from the start</button>
  </div>
</div>

<script>
(function(){
__MASCOT_JS__

const DRAW = { squat:"__SQUAT__", plate:"__PLATE__", morning:"__MORNING__", wind:"__WIND__" };
const GLYPH = {
  peri:"M20 4 a14 14 0 1 1 0 28 a14 14 0 1 1 0 -28 M20 4 a9 14 0 0 0 0 28",
  meno:"M20 4 a14 14 0 1 1 0 28 a14 14 0 1 1 0 -28 M20 4 V32",
  post:"M7 26 a13 13 0 0 1 26 0 M2 26 H38 M20 6 v4 M9 11 l3 3 M31 11 l-3 3",
  surg:"M20 4 a14 14 0 1 1 -10 4.2 M10 8.2 l-1 -5 M10 8.2 l5 -.8",
  unsure:"M13 14 a7 7 0 1 1 9.5 6.5 c-2.2 1 -2.5 2.6 -2.5 5 M20 32 v.2"
};
const STAGES = [["peri","Perimenopause"],["meno","Menopause"],["post","After menopause"],["surg","Surgical"],["unsure","Not sure"]];
const ACK = { peri:"Perimenopause. I'll plan around the harder days.", meno:"Menopause. Noted.", post:"After menopause. Strength matters even more now.", surg:"Thank you for telling me. We'll go gently.", unsure:"That's fine. We'll work it out together." };
const GOALS = [["strong","Strength","squat"],["protein","Protein","plate"],["energy","Energy","morning"],["sleep","Sleep","wind"]];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const NS = "http://www.w3.org/2000/svg";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const page = document.getElementById("page");
const esc = s => String(s).replace(/[<>&"]/g, ch => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"})[ch]);

let S, epoch = 0;
const fresh = () => ({ coach:"bramble", name:"Bramble", named:false, stage:null, goals:[], days:[] });
const coachName = () => (S.name || "").trim() || CHARS[S.coach].name;
const goalText = () => S.goals.map(g => GOALS.find(x => x[0] === g)[1].toLowerCase()).join(" and ");
const dayText = () => S.days.map(d => DAYS[d]).join(", ");

/* cancellable waits: switching experience bumps the epoch and stops old scripts */
class Stop extends Error {}
function wait(ms){ const e = epoch; return new Promise((res, rej) => setTimeout(() => e === epoch ? res() : rej(new Stop()), REDUCED ? Math.min(ms, 30) : ms)); }
function alive(e){ if (e !== epoch) throw new Stop(); }
function el(tag, cls, html){ const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function prect(n){ const p = page.getBoundingClientRect(), r = n.getBoundingClientRect(); return {x:r.left-p.left, y:r.top-p.top, w:r.width, h:r.height}; }
function relTo(n, root){ const p = root.getBoundingClientRect(), r = n.getBoundingClientRect(), s = (root._scale || 1); return {x:(r.left-p.left)/s, y:(r.top-p.top)/s, w:r.width/s, h:r.height/s}; }

/* ink */
function inkLayer(root, w, h){ const s = document.createElementNS(NS, "svg"); s.setAttribute("class", "ink"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`); root.appendChild(s); return s; }
function smooth(pts){

}
