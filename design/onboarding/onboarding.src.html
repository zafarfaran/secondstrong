<meta charset="utf-8">
<title>Second Strong Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Gochi+Hand&family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: one phone-sized notebook page, centred on a quiet desk. Scenes turn like pages; the coach and the margin notes persist across them. */
:root{
  --bg:#FBF8F4; --card:#F6F0E8; --almond:#EDE3D6; --ink:#3B322C; --ink2:#5D534B;
  --taupe:#A8968A; --terra:#A85A3C; --apricot:#F0C9A8; --edge:rgba(59,50,44,.10);
  --desk:#EAE2D7; --shadow:rgba(59,50,44,.22);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-serif:"Newsreader", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Gochi Hand", "Comic Sans MS", cursive;
  /* motion language */
  --t-fb:160ms; --t-ui:380ms; --t-scene:680ms;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
  --spring-soft:linear(0, .02 1.5%, .1 4%, .38 10%, .72 18%, .92 26%, 1.02 34%, 1.05 40%, 1.04 48%, 1.01 60%, 1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --desk:#1A1512; color-scheme:light }}
:root[data-theme="dark"]{ --desk:#1A1512 }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk); color:var(--ink); font:400 16px/1.45 var(--f-display); display:grid; place-items:center; padding-inline:16px; padding-block:24px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--terra); outline-offset:3px}

.desk{display:grid; gap:14px; justify-items:center; width:100%}
.caption{font:500 11px/1.3 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:color-mix(in srgb,var(--ink2) 70%, var(--desk)); text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .caption{color:#A8968A}}
:root[data-theme="dark"] .caption{color:#A8968A}

.phone{position:relative; width:min(100%,400px); height:min(820px, calc(100vh - 80px)); min-height:640px; border-radius:46px; background:#2A231F; padding:10px; box-shadow:0 30px 60px -20px rgba(40,30,20,.45), 0 0 0 1px rgba(0,0,0,.2)}
@media (max-width:480px){ body{padding:0; display:block} .desk{gap:0} .caption{display:none} .phone{width:100%; height:100vh; height:100dvh; min-height:0; border-radius:0; padding:0; box-shadow:none} .page{border-radius:0!important} }
.page{position:relative; width:100%; height:100%; border-radius:37px; background:var(--bg); overflow:hidden; perspective:1400px; isolation:isolate}
/* faint notebook rule */
.page::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 31px, rgba(59,50,44,.045) 31px 32px); pointer-events:none; z-index:0}

/* top bar */
.top{position:absolute; inset:0 0 auto 0; z-index:5; display:grid; grid-template-columns:44px 1fr 56px; align-items:center; gap:6px; padding:16px 16px 0}
.icon-btn{appearance:none; border:0; background:transparent; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; cursor:pointer; transition:background var(--t-fb), transform var(--t-fb), opacity var(--t-ui)}
.icon-btn:hover{background:rgba(59,50,44,.06)} .icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.skip{appearance:none; border:0; background:transparent; font:600 14px/1 var(--f-display); color:var(--ink2); cursor:pointer; padding:10px 4px; border-radius:10px; transition:opacity var(--t-ui), color var(--t-fb)}
.skip:hover{color:var(--ink)}
.is-hidden{opacity:0; pointer-events:none}
.pencil{height:14px; width:100%}
.pencil path{fill:none; stroke-linecap:round}
.pencil .track{stroke:rgba(59,50,44,.12); stroke-width:2}
.pencil .done{stroke:var(--ink); stroke-width:2.6; transition:stroke-dashoffset 700ms var(--ease)}

/* margin notes */
.notes{position:absolute; left:22px; right:104px; top:62px; z-index:4; min-height:22px; display:flex; align-items:baseline; gap:8px; transition:opacity var(--t-ui)}
.notes .run{display:flex; align-items:baseline; gap:2px 8px; min-width:0; overflow:hidden; white-space:nowrap; scroll-behavior:smooth; -webkit-mask:linear-gradient(90deg,transparent 0,#000 28px); mask:linear-gradient(90deg,transparent 0,#000 28px)}
.notes .run.flush{-webkit-mask:none; mask:none}
.notes.full{right:22px}
.notes.full .run{flex-wrap:wrap; white-space:normal; overflow:visible; -webkit-mask:none; mask:none}
.notes .lbl{font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; margin-right:2px}
.note{font:400 18px/1.15 var(--f-hand); color:var(--terra); white-space:nowrap; display:inline-block}
.note.writing{animation:write 640ms steps(12) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)}}
.note + .note::before{content:"·"; margin-right:8px; color:var(--taupe)}

/* companion */
.companion{position:absolute; left:0; top:0; width:180px; height:180px; z-index:6; transform-origin:0 0; transition:transform 760ms var(--spring-soft); pointer-events:none}
.companion .m{width:100%; height:100%; display:block}
.companion .swap{animation:swap 460ms var(--spring) both}
@keyframes swap{from{transform:scale(.82) translateY(10px)} to{transform:none}}
.companion.pos-off{transform:translate(110px, 900px) scale(.7)}
.companion.pos-stage{transform:translate(var(--cx-stage), 150px) scale(1)}
.companion.pos-corner{transform:translate(calc(var(--pw) - 96px), 52px) scale(.44)}
.companion.pos-center{transform:translate(var(--cx-stage), 200px) scale(1.05)}
.companion .say{position:absolute; left:132px; top:2px; font:400 21px/1 var(--f-hand); color:var(--terra); white-space:nowrap; transform:rotate(-5deg); opacity:0; transition:opacity var(--t-ui)}
.companion.pos-stage .say.on, .companion.pos-center .say.on{opacity:1}

/* scenes */
.stage{position:absolute; inset:0; z-index:2}
.scene{position:absolute; inset:0; padding:100px 22px 22px; display:flex; flex-direction:column; gap:14px; transform-origin:0 50%; backface-visibility:hidden; background:transparent}
.scene.turning{background:var(--bg); box-shadow:-30px 0 60px -30px rgba(59,50,44,.35)}
.meta{font:500 11.5px/1.2 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase}
.title{font:800 30px/1.02 var(--f-display); letter-spacing:-.035em; margin:0; text-wrap:balance; max-width:13ch}
.title em{font-family:var(--f-serif); font-style:italic; font-weight:400; letter-spacing:-.015em}
.sub{margin:0; color:var(--ink2); font-size:15.5px; max-width:30ch}
.with-coach .title,.with-coach .sub{max-width:calc(100% - 80px)}
.spacer{flex:1}

.btn{appearance:none; border:0; height:54px; border-radius:99px; background:var(--ink); color:var(--bg); font:600 16.5px/1 var(--f-display); cursor:pointer; width:100%; transition:transform var(--t-fb) var(--ease), opacity var(--t-ui), background var(--t-fb); position:relative; z-index:3}
.btn:hover{background:#2E2621}
.btn:active{transform:scale(.97)}
.btn[aria-disabled="true"]{opacity:.32; cursor:default}
.btn[aria-disabled="true"]:active{transform:none}
.hint{font:400 17px/1 var(--f-hand); color:var(--terra); text-align:center; min-height:18px; margin:-4px 0 0}

/* welcome */
.welcome{padding-top:120px}
.welcome .title{font-size:40px; max-width:9ch}
.underline{display:block; width:190px; height:16px; margin-top:-2px}
.underline path{fill:none; stroke:var(--terra); stroke-width:3; stroke-linecap:round; stroke-dasharray:240; stroke-dashoffset:240; animation:drawline 900ms 500ms var(--ease) forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
.cast{position:absolute; left:-8px; right:-8px; bottom:96px; height:96px; display:flex; justify-content:center; pointer-events:auto}
.cast .peek{width:74px; height:74px; margin:0 -9px; flex:none; position:relative; transform:translateY(120px); animation:peek 700ms var(--spring) forwards; cursor:pointer; appearance:none; border:0; background:transparent; padding:0; border-radius:50%}
.cast .peek .m{width:100%; height:100%}
.cast .peek:nth-child(even){margin-top:14px}
@keyframes peek{to{transform:translateY(0)}}
.cast.leaving .peek{animation:drop 420ms var(--ease) forwards}
@keyframes drop{from{transform:translateY(0)} to{transform:translateY(160px)}}
.welcome .btn-wrap{margin-top:auto}
.magnet{transition:transform 260ms var(--ease)}

/* coach pick */
.pick-gap{height:176px; flex:none}
.thumbs{display:flex; gap:8px; justify-content:space-between}
.thumb{appearance:none; flex:1 1 0; min-width:0; aspect-ratio:1; border-radius:14px; border:1px solid var(--edge); background:var(--card); padding:2px; cursor:pointer; transition:transform 200ms var(--ease), border-color var(--t-fb), box-shadow var(--t-fb); transform:perspective(300px) rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.thumb .m{width:100%; height:100%; display:block}
.thumb[aria-checked="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.trait{margin:0; text-align:center; font-size:15px; color:var(--ink2); min-height:22px}
.trait b{color:var(--ink); font-weight:800}
.field{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding:4px 2px 6px}
.field label{font:500 11px/1 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; flex:none}
.field input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:800 24px/1.1 var(--f-display); letter-spacing:-.02em; padding:2px 0; outline:none}

/* option cards */
.opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opt{appearance:none; text-align:left; border:1.5px solid color-mix(in srgb,var(--ink) 16%,transparent); background:var(--card); border-radius:16px; padding:12px 12px 13px; cursor:pointer; display:grid; gap:3px; position:relative; transition:transform var(--t-fb) var(--ease), background var(--t-ui) var(--ease), color var(--t-ui), border-color var(--t-ui)}
.opt:hover{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.opt:active{transform:scale(.97)}
.opt b{font:800 15.5px/1.15 var(--f-display); letter-spacing:-.01em}
.opt span{font-size:12.5px; line-height:1.3; color:var(--ink2); transition:color var(--t-ui)}
.opt[aria-checked="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); animation:stamp 420ms var(--spring)}
.opt[aria-checked="true"] span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.opt.wide{grid-column:1 / -1}
@keyframes stamp{0%{transform:scale(.95)} 100%{transform:scale(1)}}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 20%,transparent); background:transparent; border-radius:99px; padding:9px 13px; font:600 14px/1 var(--f-display); cursor:pointer; transition:background var(--t-fb), color var(--t-fb), border-color var(--t-fb), transform var(--t-fb) var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-checked="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); animation:stamp 380ms var(--spring)}
.reveal-in{animation:rise var(--t-ui) var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}
.qlabel{font:500 11px/1.2 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; margin:2px 0 -4px}

/* goal sketches */
.canvas{position:relative; height:150px; border-radius:18px; background:var(--card); border:1px solid var(--edge); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; gap:4px}
.canvas .empty{font:400 19px/1.2 var(--f-hand); color:var(--taupe); text-align:center; padding:0 30px}
.draw{width:130px; height:130px; background:var(--ink); -webkit-mask:var(--src) center / contain no-repeat; mask:var(--src) center / contain no-repeat; flex:none}
.draw.sketch{animation:sketch 1100ms var(--ease) both}
@keyframes sketch{from{clip-path:polygon(0 0,0 0,0 0)} to{clip-path:polygon(0 0,250% 0,0 250%)}}
.draw.out{animation:fadeout 260ms var(--ease) forwards}
@keyframes fadeout{to{opacity:0; transform:scale(.94)}}
.goals .opt{grid-template-columns:auto 1fr; align-items:center; column-gap:10px}
.goals .opt i{grid-row:span 2; width:34px; height:34px; background:currentColor; -webkit-mask:var(--src) center / contain no-repeat; mask:var(--src) center / contain no-repeat}

/* week */
.rack{display:flex; gap:6px; align-items:flex-end; justify-content:space-between; padding:12px 12px 10px; background:var(--card); border:1px solid var(--edge); border-radius:18px}
.bell{appearance:none; border:0; background:transparent; cursor:pointer; display:grid; justify-items:center; gap:5px; padding:4px 2px; flex:1; border-radius:12px; transition:transform var(--t-fb) var(--ease)}
.bell:active{transform:scale(.92)}
.bell svg{display:block; transition:transform 420ms var(--spring)}
.bell .plate{fill:color-mix(in srgb,var(--ink) 18%,transparent); transition:fill var(--t-ui)}
.bell .bar{fill:color-mix(in srgb,var(--ink) 28%,transparent); transition:fill var(--t-ui)}
.bell[aria-checked="true"] .plate{fill:var(--ink)}
.bell[aria-checked="true"] .bar{fill:#6E6158}
.bell[aria-checked="true"] svg{transform:translateY(-4px)}
.bell em{font:500 11px/1 var(--f-mono); font-style:normal; color:var(--ink2)}
.bell[aria-checked="true"] em{color:var(--ink)}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent); background:transparent; border-radius:14px; height:52px; display:grid; place-items:center; cursor:pointer; font:600 13px/1 var(--f-display); position:relative; transition:background var(--t-fb), color var(--t-fb), border-color var(--t-fb), transform var(--t-fb) var(--ease)}
.day:active{transform:scale(.93)}
.day[aria-checked="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); animation:stamp 380ms var(--spring)}
.weeksum{font-size:14.5px; color:var(--ink2); min-height:21px; margin:0}
.weeksum b{color:var(--ink)}

/* reveal + today */
.plan{gap:10px; padding-top:96px}
.card{background:var(--card); border:1px solid var(--edge); border-radius:18px; padding:12px 14px 13px; display:grid; gap:7px}
.card .k{font:500 10.5px/1 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; display:flex; justify-content:space-between; gap:8px}
.card .v{font:800 19px/1.1 var(--f-display); letter-spacing:-.02em}
.card .v small{font:400 14px/1 var(--f-display); color:var(--ink2); letter-spacing:0}
.slot{font:400 17px/1 var(--f-hand); color:var(--terra)}
.pbar{height:12px; width:100%}
.pbar path{fill:none; stroke-linecap:round}
.pbar .track{stroke:rgba(59,50,44,.12); stroke-width:6}
.pbar .fill{stroke:var(--apricot); stroke-width:8; stroke-dasharray:320; stroke-dashoffset:320}
.plan.go .pbar .fill{transition:stroke-dashoffset 1100ms 300ms var(--ease); stroke-dashoffset:0}
.wk{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.wk span{font:500 10px/1 var(--f-mono); color:var(--ink2)}
.wk i{display:block; height:26px; margin-top:5px; border-radius:9px; background:rgba(59,50,44,.06); transform:scale(.6); opacity:0}
.wk i.on{background:var(--ink)}
.plan.go .wk i{animation:pop 420ms var(--spring) forwards}
@keyframes pop{to{transform:scale(1); opacity:1}}
.letter{font-size:14.5px; line-height:1.42}
.letter .w{display:inline; opacity:0}
.plan.go .letter .w{animation:wipe 520ms var(--ease) forwards}
@keyframes wipe{from{opacity:0; filter:blur(3px)} to{opacity:1; filter:none}}
.row2{display:grid; grid-template-columns:1fr 92px; gap:10px}
.mini-draw{width:100%; height:100%; min-height:86px; background:var(--card); border:1px solid var(--edge); border-radius:18px; display:grid; place-items:center}
.mini-draw .draw{width:74px; height:74px}
.writing-plan{position:absolute; left:0; right:0; top:420px; text-align:center; font:400 22px/1 var(--f-hand); color:var(--terra); opacity:0; transition:opacity var(--t-ui)}
.writing-plan.on{opacity:1}
.fly{position:absolute; z-index:20; font:400 18px/1.15 var(--f-hand); color:var(--terra); white-space:nowrap; pointer-events:none; will-change:transform}

.today{padding-bottom:0}
.faces{display:flex; justify-content:space-between; padding:2px 4px}
.faces button{appearance:none; border:0; background:transparent; width:44px; height:44px; border-radius:50%; cursor:pointer; display:grid; place-items:center; transition:transform var(--t-fb) var(--ease)}
.faces button:active{transform:scale(.9)}
.faces svg{width:34px; height:34px; fill:none; stroke:var(--taupe); stroke-width:1.8; stroke-linecap:round}
.faces button[aria-checked="true"] svg{stroke:var(--ink)}
.faces button[aria-checked="true"]{box-shadow:0 0 0 1.8px var(--terra)}
.tabs{margin:auto -22px 0; border-top:1px solid var(--edge); display:grid; grid-template-columns:repeat(4,1fr); padding:8px 6px 18px; background:var(--bg)}
.tabs span{display:grid; justify-items:center; gap:4px; font:500 10px/1 var(--f-mono); letter-spacing:.04em; color:var(--taupe); position:relative}
.tabs svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tabs .on{color:var(--ink)}
.tabs .on::after{content:""; position:absolute; bottom:-7px; width:16px; height:2.5px; border-radius:2px; background:var(--terra)}
.restart{appearance:none; border:0; background:transparent; font:500 11px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); cursor:pointer; padding:8px; border-radius:8px}
.restart:hover{color:var(--ink)}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

__MASCOT_CSS__
.m .look{translate:var(--lx,0px) var(--ly,0px); transition:transform .35s ease, translate .14s linear}
.mini-draw{gap:2px; align-content:center; padding:6px}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:1ms!important; animation-delay:0ms!important; transition-duration:1ms!important}
  .companion{transition:none}
}
</style>

<div class="desk">
  <div class="phone" id="phone">
    <div class="page" id="page">
      <div class="top">
        <button class="icon-btn is-hidden" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg></button>
        <svg class="pencil" id="pencil" viewBox="0 0 220 14" preserveAspectRatio="none" aria-hidden="true">
          <path class="track" d="M2 8 C40 5 80 10 120 7 C160 4 190 9 218 6"/>
          <path class="done" id="pencilDone" d="M2 8 C40 5 80 10 120 7 C160 4 190 9 218 6"/>
        </svg>
        <button class="skip is-hidden" id="skip" type="button">Skip</button>
      </div>
      <div class="notes is-hidden" id="notes" aria-live="polite"><span class="lbl">Notes</span><span class="run" id="noteRun"></span></div>
      <div class="stage" id="stage"></div>
      <div class="companion pos-off" id="companion" data-state="idle" aria-hidden="true"><div class="host" id="coachHost"></div><span class="say" id="say"></span></div>
      <div class="writing-plan" id="writingPlan">writing your plan…</div>
    </div>
  </div>
  <p class="caption">Second Strong · onboarding prototype · Esc goes back, Enter continues</p>
</div>

<script>
(function(){
__MASCOT_JS__

const DRAW = { squat:"__SQUAT__", plate:"__PLATE__", sitstand:"__SITSTAND__", morning:"__MORNING__", wind:"__WIND__" };
const STAGES = [
  {id:"peri", b:"Perimenopause", s:"Cycles changing, new symptoms", note:"perimenopause", line:"Perimenopause noted."},

];

const GOALS = [
  {id:"strong", b:"Get stronger", s:"Lift a little more each week", draw:"squat", note:"get stronger"},
  {id:"protein", b:"Eat enough protein", s:"Close the gap, no dieting", draw:"plate", note:"enough protein"},
  {id:"years", b:"Stay strong for years", s:"Bone, balance, getting up easily", draw:"sitstand", note:"strong for years"},
  {id:"energy", b:"More energy", s:"Steadier days", draw:"morning", note:"more energy"},
  {id:"sleep", b:"Sleep better", s:"Calmer evenings", draw:"wind", note:"better sleep"}
];
const KIT = [2,4,6,8,10,12];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const OPENERS = { pebble:"Noted.", fern:"Thank you for telling me all that.", wren:"Right, here's the plan.", bramble:"Good. A practical start.", luna:"Gently does it.", otto:"Lovely. Let's keep this easy.", tilly:"We'll build this slowly." };
const STEPS = ["welcome","coach","stage","goal","week","reveal","today"];
const KEY = "ss-onboarding-v1";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const fresh = () => ({ step:0, coach:"pebble", name:"Pebble", named:false, stage:null, symptoms:[], goals:[], kit:[], gym:false, days:[] });
let S = fresh();
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && typeof saved.step === "number") S = Object.assign(fresh(), saved); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

const $ = id => document.getElementById(id);
const page = $("page"), stage = $("stage"), comp = $("companion"), host = $("coachHost");
const esc = s => String(s).replace(/[<>&"]/g, ch => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"})[ch]);
const coachName = () => (S.name || "").trim() || CHARS[S.coach].name;

/* geometry for companion positions */
function measure(){
  const w = page.clientWidth;
  page.style.setProperty("--pw", w + "px");
  page.style.setProperty("--cx-stage", Math.round((w - 180) / 2) + "px");
}
new ResizeObserver(measure).observe(page); measure();

/* companion */
let stateTimer;
function drawCoach(swap){
  host.innerHTML = mascot(S.coach);
  if (swap) { host.firstElementChild.classList.add("swap"); }
}
function coachState(s, ms){
  clearTimeout(stateTimer);
  comp.dataset.state = s;
  if (ms) stateTimer = setTimeout(() => comp.dataset.state = "idle", ms);
}
function coachPos(p){ comp.className = "companion pos-" + p; }
function say(t){ const el = $("say"); el.textContent = t || ""; el.classList.toggle("on", !!t); }

/* pointer: eyes follow, cards tilt, magnetic button */
page.addEventListener("pointermove", e => {
  if (REDUCED) return;
  page.querySelectorAll(".m").forEach(svg => {
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height*0.45);
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 220);
    svg.style.setProperty("--lx", (dx/d*3.2*k).toFixed(2) + "px");
    svg.style.setProperty("--ly", (dy/d*2.6*k).toFixed(2) + "px");
  });
  const mag = page.querySelector(".magnet");
  if (mag) {
    const r = mag.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy, near = Math.abs(dy) < 70 && Math.abs(dx) < r.width/2 + 30;
    mag.style.transform = near ? `translate(${dx*0.06}px, ${dy*0.18}px)` : "";
  }
});
page.addEventListener("pointerleave", () => {
  page.querySelectorAll(".m").forEach(svg => { svg.style.setProperty("--lx","0px"); svg.style.setProperty("--ly","0px"); });
  const mag = page.querySelector(".magnet"); if (mag) mag.style.transform = "";
});
function tilt(el){
  el.addEventListener("pointermove", e => {
    if (REDUCED) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--rx", ((0.5 - (e.clientY - r.top)/r.height) * 14).toFixed(1) + "deg");
    el.style.setProperty("--ry", (((e.clientX - r.left)/r.width - 0.5) * 14).toFixed(1) + "deg");
  });
  el.addEventListener("pointerleave", () => { el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); });
}

/* notes */
function noteList(){
  const n = [];
  if (S.stage) n.push({k:"stage", t:STAGES.find(x => x.id === S.stage).note});
  if (S.symptoms.length) n.push({k:"symptoms", t:S.symptoms.map(k => SYMPTOMS.find(x => x[0]===k)[1].toLowerCase()).join(" & ")});
  if (S.goals.length) n.push({k:"goals", t:S.goals.map(k => GOALS.find(g => g.id===k).note).join(" + ")});
  if (S.step >= 4 && (S.kit.length || S.gym || S.days.length)) n.push({k:"kit", t:kitText(true)});
  if (S.days.length) n.push({k:"days", t:S.days.map(d => DAYS[d]).join(" ")});
  return n;
}
function kitText(short){
  if (S.gym) return short ? "gym" : "gym kit";
  if (!S.kit.length) return short ? "bodyweight" : "bodyweight and a chair";
  return S.kit.slice().sort((a,b)=>a-b).join(" & ") + "kg";
}
let shownNotes = [];
function renderNotes(){
  const step = S.step, box = $("notes"), list = noteList();
  const run = $("noteRun");
  box.classList.toggle("is-hidden", step < 2 || step > 5);
  box.classList.toggle("full", step === 5);
  box.querySelectorAll(".note").forEach(n => n.remove());
  list.forEach(({k, t}) => {
    const s = document.createElement("span"); s.className = "note"; s.textContent = t; s.dataset.k = k;
    if (!shownNotes.includes(t)) s.classList.add("writing");
    run.appendChild(s);
  });
  shownNotes = list.map(n => n.t);
  requestAnimationFrame(() => { run.scrollLeft = run.scrollWidth; run.classList.toggle("flush", run.scrollLeft < 2); });
}

/* chrome */
function chrome(step){
  $("back").classList.toggle("is-hidden", step === 0 || step >= 6);
  $("skip").classList.toggle("is-hidden", step === 0 || step >= 5);
  $("pencil").classList.toggle("is-hidden", step === 0 || step >= 6);
  const p = $("pencilDone"), len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len * (1 - Math.min(1, step / 5));
}

function sceneEl(cls){ const el = document.createElement("section"); el.className = "scene " + cls; return el; }
function radio(group, onPick){
  group.addEventListener("click", e => {
    const b = e.target.closest("[role=radio]"); if (!b) return;
    group.querySelectorAll("[role=radio]").forEach(x => x.setAttribute("aria-checked", x === b));
    onPick(b.dataset.v);
  });
}
const gates = new WeakMap();
function gate(el, test){
  if (test) gates.set(el, test);
  const t = gates.get(el), btn = el.querySelector("[data-next]");
  if (btn && t) btn.setAttribute("aria-disabled", String(!t()));
}

/* ---------- navigation ---------- */
let current = null, busy = false;
function go(n, dir){
  if (busy && current) return;
  const name = STEPS[n], next = scenes[name]();
  next.setAttribute("aria-label", name);
  const prev = current;
  S.step = n; save();
  stage.appendChild(next);
  current = next;
  chrome(n); renderNotes();
  next.querySelector("[data-next]")?.addEventListener("click", e => {
    if (e.currentTarget.getAttribute("aria-disabled") === "true") return;
    advance();
  });
  if (!prev || REDUCED) { prev?.remove(); focusScene(next); if (name === "reveal") runReveal(next, true); return; }
  busy = true;
  const fwd = dir >= 0, D = 680;
  const ease = "cubic-bezier(.22,1,.36,1)";
  if (name === "reveal") {
    prev.animate([{opacity:1},{opacity:0}], {duration:300, easing:ease, fill:"forwards"});
    next.style.opacity = "0";
    setTimeout(() => { prev.remove(); runReveal(next, false); busy = false; }, 320);
    return;
  }
  if (prev.classList.contains("welcome")) prev.querySelector("#cast")?.classList.add("leaving");
  prev.classList.add("turning");
  prev.style.zIndex = fwd ? 2 : 1; next.style.zIndex = fwd ? 1 : 2;
  const out = fwd
    ? [{transform:"rotateY(0deg)", opacity:1}, {transform:"rotateY(-62deg) translateX(-12%)", opacity:0}]
    : [{transform:"translateX(0)", opacity:1}, {transform:"translateX(14%)", opacity:0}];
  const inn = fwd
    ? [{transform:"translateX(10%)", opacity:0}, {transform:"translateX(0)", opacity:1}]
    : [{transform:"rotateY(-62deg) translateX(-12%)", opacity:0}, {transform:"rotateY(0deg)", opacity:1}];
  prev.animate(out, {duration:D, easing:ease, fill:"forwards"});
  next.animate(inn, {duration:D, delay:fwd ? 90 : 0, easing:ease, fill:"backwards"}).finished.then(() => {
    prev.remove(); next.style.zIndex = ""; busy = false; focusScene(next);
  });
}
function focusScene(el){ const h = el.querySelector("h1,h2"); if (h) { h.tabIndex = -1; h.focus({preventScroll:true}); } }
function advance(){ if (S.step < STEPS.length - 1) go(S.step + 1, 1); }
function back(){ if (S.step > 0 && S.step < 6) go(S.step - 1, -1); }

/* the reveal: coach thinks, notes fly into the plan, the plan settles */
function runReveal(el, instant){
  const notes = [...$("notes").querySelectorAll(".note")];
  if (instant) { el.style.opacity = "1"; el.classList.add("go"); coachState("proud", 1800); return; }
  coachPos("center"); coachState("thinking"); $("writingPlan").classList.add("on");
  const rects = notes.map(n => n.getBoundingClientRect());
  const texts = notes.map(n => n.textContent), keys = notes.map(n => n.dataset.k);
  const pr = page.getBoundingClientRect();
  let skipped = false;
  const finish = () => {
    if (skipped) return; skipped = true;
    $("writingPlan").classList.remove("on");
    el.style.transition = "opacity 380ms cubic-bezier(.22,1,.36,1)"; el.style.opacity = "1";
    el.classList.add("go");
    coachPos("corner"); coachState("proud", 1900);
    $("notes").classList.add("is-hidden");
    /* fly each note to a slot in the plan */
    texts.forEach((t, i) => {
      const slot = [...el.querySelectorAll(".slot")].find(s => s.dataset.k.split(" ").includes(keys[i])); if (!slot) return;
      const from = rects[i], to = slot.getBoundingClientRect();
      const f = document.createElement("span"); f.className = "fly"; f.textContent = t;
      f.style.left = (from.left - pr.left) + "px"; f.style.top = (from.top - pr.top) + "px";
      page.appendChild(f);
      slot.style.opacity = "0";
      f.animate([{transform:"translate(0,0) rotate(0deg)", opacity:1},
                 {transform:`translate(${(to.left - from.left)*0.5}px, ${(to.top - from.top)*0.5 - 30}px) rotate(-4deg)`, opacity:1, offset:.5},
                 {transform:`translate(${to.left - from.left}px, ${to.top - from.top}px)`, opacity:0}],
        {duration:820, delay:i*90, easing:"cubic-bezier(.5,0,.2,1)", fill:"forwards"})
       .finished.then(() => { f.remove(); slot.style.transition = "opacity 300ms"; slot.style.opacity = "1"; });
    });
  };
  setTimeout(finish, 1150);
  page.addEventListener("pointerdown", finish, {once:true});
}

/* keyboard */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { back(); return; }
  if (e.key === "Enter" && current) {
    const t = e.target, tag = t.tagName;
    if (tag === "BUTTON") return;
    const btn = current.querySelector("[data-next]");
    if (btn && btn.getAttribute("aria-disabled") !== "true") { e.preventDefault(); advance(); }
  }
});
$("back").addEventListener("click", back);
$("skip").addEventListener("click", () => {
  if (!S.stage) S.stage = "unsure";
  if (!S.goals.length) S.goals = ["strong"];
  if (S.days.length < 2) S.days = [0,2,4];
  save(); go(5, 1);
});

drawCoach(false);
const start = Math.min(S.step || 0, 6);
if (start >= 2) { coachPos("corner"); }
go(start, 1);
})();
</script>
