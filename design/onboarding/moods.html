<meta charset="utf-8">
<title>Onboarding Moods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Gochi+Hand&family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: a quiet desk. Left, the five line treatments and what each one means; right, one live phone running the chosen variant. */
:root{
  --bg:#FBF8F4; --card:#F6F0E8; --almond:#EDE3D6; --ink:#3B322C; --ink2:#5D534B;
  --taupe:#A8968A; --terra:#A85A3C; --apricot:#F0C9A8; --edge:rgba(59,50,44,.10);
  --desk:#EFE8DE; --deskInk:#3B322C; --deskInk2:#6E6158; --shadow:rgba(59,50,44,.22);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-serif:"Newsreader", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Gochi Hand", "Comic Sans MS", cursive;
  --t-fb:160ms; --t-ui:380ms;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
  --spring-soft:linear(0, .02 1.5%, .1 4%, .38 10%, .72 18%, .92 26%, 1.02 34%, 1.05 40%, 1.04 48%, 1.01 60%, 1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --desk:#1C1714; --deskInk:#F1E9DF; --deskInk2:#B8AA9D; color-scheme:dark }}
:root[data-theme="dark"]{ --desk:#1C1714; --deskInk:#F1E9DF; --deskInk2:#B8AA9D; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--desk); color:var(--deskInk); font:400 16px/1.45 var(--f-display); margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--terra); outline-offset:3px}
.wrap{max-width:1120px; margin:0 auto; padding-inline:clamp(16px,3vw,40px); padding-block:32px 48px; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:48px; align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr); gap:24px} }
.side{position:sticky; top:32px; display:grid; gap:18px}
@media (max-width:900px){ .side{position:static} }
.dmeta{font:500 12px/1.2 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--deskInk2)}
.side h1{font:800 clamp(30px,4vw,44px)/1.02 var(--f-display); letter-spacing:-.035em; margin:0; text-wrap:balance}
.side h1 em{font-family:var(--f-serif); font-style:italic; font-weight:400}
.side .lede{margin:0; color:var(--deskInk2); max-width:52ch}
.vlist{display:grid; gap:8px; margin:6px 0 0; padding:0; list-style:none}
.vbtn{appearance:none; width:100%; text-align:left; border:1.5px solid color-mix(in srgb,var(--deskInk) 14%,transparent); background:transparent; border-radius:16px; padding:12px 14px; cursor:pointer; display:grid; grid-template-columns:44px 1fr; gap:2px 12px; align-items:center; transition:border-color var(--t-fb), background var(--t-fb)}
.vbtn:hover{border-color:color-mix(in srgb,var(--deskInk) 35%,transparent)}
.vbtn[aria-pressed="true"]{border-color:var(--deskInk); background:color-mix(in srgb,var(--deskInk) 6%,transparent)}
.vbtn .sw{grid-row:span 2; display:flex; width:44px; height:44px; border-radius:12px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.vbtn .sw i{flex:1}
.vbtn b{font:800 16px/1.15 var(--f-display)}
.vbtn span{font-size:13.5px; color:var(--deskInk2); line-height:1.35}
.vbtn i{font-style:normal; font:500 11px/1 var(--f-mono); color:var(--deskInk2); margin-right:6px}
.tip{font:500 11px/1.4 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--deskInk2); margin:0}

.phone-col{display:grid; justify-items:center; gap:12px}
.phone{position:relative; width:min(100%,390px); height:800px; border-radius:46px; background:#2A231F; padding:10px; box-shadow:0 30px 60px -20px rgba(40,30,20,.45), 0 0 0 1px rgba(0,0,0,.2)}
@media (max-width:480px){ .phone{height:760px} }
.page{position:relative; width:100%; height:100%; border-radius:37px; background:var(--bg); color:var(--ink); overflow:hidden; perspective:1400px; isolation:isolate}
.page{transition:background 600ms var(--ease)}
.page::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); pointer-events:none}
.page::after{content:""; position:absolute; inset:0; background:var(--glow); pointer-events:none; z-index:0}
.replay{appearance:none; border:0; background:transparent; font:500 11px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--deskInk2); cursor:pointer; padding:8px 10px; border-radius:8px}
.replay:hover{color:var(--deskInk)}

/* phone chrome */
.top{position:absolute; inset:0 0 auto 0; z-index:7; display:grid; grid-template-columns:44px 1fr 52px; align-items:center; gap:6px; padding:16px 16px 0; height:58px}
.icon-btn{appearance:none; border:0; background:transparent; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; cursor:pointer; transition:background var(--t-fb), transform var(--t-fb), opacity var(--t-ui)}
.icon-btn:hover{background:rgba(59,50,44,.06)} .icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.skip{appearance:none; border:0; background:transparent; font:600 14px/1 var(--f-display); color:var(--ink2); cursor:pointer; padding:10px 4px; border-radius:10px; transition:opacity var(--t-ui)}
.is-hidden{opacity:0; pointer-events:none}
.prog{height:40px; width:100%; overflow:visible}

.ink{position:absolute; inset:0; z-index:5; pointer-events:none; overflow:visible; mix-blend-mode:var(--blend)}
.ink path{fill:none; stroke-linecap:round; stroke-linejoin:round}
.ink .fade{transition:opacity 360ms var(--ease); opacity:0}
.ink path.pick,.ink path.hl,.ink path.hlnum{mix-blend-mode:multiply}
.title:focus{outline:none}

/* companion */
.companion{position:absolute; left:0; top:0; width:180px; height:180px; z-index:6; transform-origin:0 0; transition:transform 760ms var(--spring-soft); pointer-events:none}
.companion .host{position:absolute; inset:0}
.companion .m{width:100%; height:100%; display:block}
.companion .swap{animation:swap 460ms var(--spring) both}
@keyframes swap{from{transform:scale(.82) translateY(10px)} to{transform:none}}
.companion.pos-off{transform:translate(105px, 900px) scale(.7)}
.companion.pos-stage{transform:translate(var(--cx), 150px) scale(1)}
.companion.pos-corner{transform:translate(calc(var(--pw) - 98px), 58px) scale(.44)}
.companion.pos-center{transform:translate(var(--cx), 230px) scale(1.05)}
.companion .outline{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.companion .outline path{fill:none; stroke:var(--ink); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.v-connect .companion.pos-corner{pointer-events:auto; cursor:grab}

/* scenes */
.stage{position:absolute; inset:0; z-index:2}
.scene{position:absolute; inset:0; padding:104px 22px 22px; display:flex; flex-direction:column; gap:16px; transform-origin:0 50%; backface-visibility:hidden}
.scene.turning{background:var(--bg); box-shadow:-30px 0 60px -30px rgba(59,50,44,.35)}
.meta{font:500 11.5px/1.2 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase}
.title{font:var(--tw) var(--ts)/1.02 var(--f-title); letter-spacing:var(--tls); margin:0; text-wrap:balance; max-width:calc(100% - 84px)}
.title em{font-family:var(--f-serif); font-style:italic; font-weight:400; letter-spacing:-.015em}
.spacer{flex:1}
.btn{appearance:none; border:0; height:54px; border-radius:99px; background:var(--ink); color:var(--bg); font:600 16.5px/1 var(--f-display); cursor:pointer; width:100%; transition:transform var(--t-fb) var(--ease), opacity var(--t-ui); position:relative; z-index:3}
.btn:active{transform:scale(.97)}
.btn[aria-disabled="true"]{opacity:.3; cursor:default}
.btn[aria-disabled="true"]:active{transform:none}
.hint{font:400 18px/1 var(--f-hand); color:var(--terra); text-align:center; min-height:18px; margin:-6px 0 0}

/* welcome */
.welcome{padding-top:150px}
.welcome .title{font-size:calc(var(--ts) * 1.55); max-width:7ch}
.cast{position:absolute; left:-10px; right:-10px; bottom:100px; height:96px; display:flex; justify-content:center}
.cast .peek{width:72px; height:72px; margin:0 -9px; flex:none; transform:translateY(130px); animation:peek 700ms var(--spring) forwards; cursor:pointer; appearance:none; border:0; background:transparent; padding:0; border-radius:50%}
.cast .peek .m{width:100%; height:100%}
.cast .peek:nth-child(even){margin-top:14px}
@keyframes peek{to{transform:translateY(0)}}
.cast.leaving .peek{animation:drop 420ms var(--ease) forwards}
@keyframes drop{from{transform:translateY(0)} to{transform:translateY(160px)}}

/* coach */
.pick-gap{height:180px; flex:none}
.thumbs{display:flex; gap:7px}
.thumb{appearance:none; flex:1 1 0; min-width:0; aspect-ratio:1; border-radius:14px; border:1px solid var(--edge); background:var(--card); padding:2px; cursor:pointer; transition:transform 200ms var(--ease), border-color var(--t-fb), box-shadow var(--t-fb)}
.thumb:active{transform:scale(.94)}
.thumb .m{width:100%; height:100%; display:block}
.thumb[aria-checked="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.field{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding:4px 2px 6px}
.field label{font:500 11px/1 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; flex:none}
.field input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:800 26px/1.1 var(--f-display); letter-spacing:-.02em; padding:2px 0; outline:none}

/* tiles */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 14%,transparent); background:var(--card); border-radius:20px; padding:14px 12px 12px; cursor:pointer; display:grid; justify-items:center; gap:8px; position:relative; transition:transform var(--t-fb) var(--ease), border-color var(--t-ui), background var(--t-ui)}
.tile:hover{border-color:color-mix(in srgb,var(--ink) 34%,transparent)}
.tile:active{transform:scale(.96)}
.tile b{font:700 14.5px/1.1 var(--f-display); letter-spacing:-.005em; position:relative; z-index:1}
.tile.wide{grid-column:1 / -1; grid-template-columns:auto auto; justify-content:center; align-items:center}
.tile[aria-checked="true"]{border-color:var(--ink); animation:stamp 420ms var(--spring)}
@keyframes stamp{0%{transform:scale(.95)} 100%{transform:scale(1)}}
.glyph{width:46px; height:46px; overflow:visible}
.glyph path{fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.tile[aria-checked="true"] .glyph path{stroke:var(--terra)}
.draw{background:var(--ink); -webkit-mask:var(--src) center / contain no-repeat; mask:var(--src) center / contain no-repeat}
.tile .draw{width:84px; height:84px}
.tile[aria-checked="true"] .draw{background:var(--terra)}
.sketch{animation:sketch 1000ms var(--ease) both}
@keyframes sketch{from{clip-path:polygon(0 0,0 0,0 0)} to{clip-path:polygon(0 0,250% 0,0 250%)}}
.v-drawn .tile[aria-checked="true"]{background:var(--bg)}
.v-drawn .tile{background:transparent}

/* week */
.rack{display:flex; gap:4px; align-items:flex-end; justify-content:space-between; padding:14px 10px 10px; background:var(--card); border:1px solid var(--edge); border-radius:20px}
.bell{appearance:none; border:0; background:transparent; cursor:pointer; display:grid; justify-items:center; gap:6px; padding:4px 1px; flex:1; border-radius:12px; transition:transform var(--t-fb) var(--ease)}
.bell:active{transform:scale(.92)}
.bell svg{display:block; transition:transform 420ms var(--spring)}
.bell .plate{fill:color-mix(in srgb,var(--ink) 18%,transparent); transition:fill var(--t-ui)}
.bell .bar{fill:color-mix(in srgb,var(--ink) 28%,transparent); transition:fill var(--t-ui)}
.bell[aria-checked="true"] .plate{fill:var(--ink)}
.bell[aria-checked="true"] .bar{fill:var(--ink2)}
.bell[aria-checked="true"] svg{transform:translateY(-5px)}
.bell em{font:500 11px/1 var(--f-mono); font-style:normal; color:var(--ink2)}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{appearance:none; border:1.5px solid color-mix(in srgb,var(--ink) 16%,transparent); background:transparent; border-radius:14px; height:54px; display:grid; place-items:center; cursor:pointer; font:600 14px/1 var(--f-display); transition:background var(--t-fb), color var(--t-fb), border-color var(--t-fb), transform var(--t-fb) var(--ease)}
.day:active{transform:scale(.93)}
.day[aria-checked="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); animation:stamp 380ms var(--spring)}
.sum{font:800 22px/1 var(--f-display); letter-spacing:-.02em; text-align:center; margin:2px 0 0; min-height:24px}
.sum small{font:500 11px/1 var(--f-mono); letter-spacing:.06em; color:var(--ink2); text-transform:uppercase; display:block; margin-top:6px}

/* reveal */
.plan{gap:12px; padding-top:100px}
.big{display:grid; grid-template-columns:auto 1fr; align-items:end; gap:4px 12px; padding:16px 16px 14px; background:var(--card); border:1px solid var(--edge); border-radius:20px}
.big .num{font:800 64px/.9 var(--f-display); letter-spacing:-.05em}
.big .num small{font-size:26px; letter-spacing:-.02em}
.big .lab{font:500 11px/1.3 var(--f-mono); letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; padding-bottom:6px}
.wkcard{padding:14px 16px; background:var(--card); border:1px solid var(--edge); border-radius:20px; display:grid; gap:10px}
.wk{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center}
.wk span{font:500 10px/1 var(--f-mono); color:var(--ink2)}
.wk i{display:block; height:30px; margin-top:6px; border-radius:10px; background:var(--soft); transform:scale(.5); opacity:0}
.wk i.on{background:var(--ink)}
.plan.go .wk i{animation:pop 420ms var(--spring) forwards}
@keyframes pop{to{transform:scale(1); opacity:1}}
.wkfoot{display:flex; justify-content:space-between; font:500 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink2)}
.duo{display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center}
.duo .draw{width:96px; height:96px}
.bubble{font:400 21px/1.15 var(--f-hand); color:var(--terra); margin:0}
.chartcard{padding:12px 14px 8px; background:var(--card); border:1px solid var(--edge); border-radius:20px}
.chartcard svg{width:100%; height:90px; display:block; overflow:visible}

.faces{display:flex; justify-content:space-between; padding:2px}
.faces button{appearance:none; border:0; background:transparent; width:50px; height:50px; border-radius:50%; cursor:pointer; display:grid; place-items:center; transition:transform var(--t-fb) var(--ease)}
.faces button:active{transform:scale(.9)}
.faces svg{width:40px; height:40px; fill:none; stroke:var(--taupe); stroke-width:1.8; stroke-linecap:round}
.faces button[aria-checked="true"] svg{stroke:var(--ink)}
.faces button[aria-checked="true"]{box-shadow:0 0 0 2px var(--terra)}


/* ===== moods: every token the phone uses, per feeling ===== */
.page{--rule:rgba(59,50,44,.04); --glow:none; --soft:rgba(59,50,44,.07); --hl:#F0C9A8; --hlw:12; --blend:multiply;
  --f-title:var(--f-display); --tw:800; --ts:34px; --tls:-.035em; --tile-r:20px; --tile-shadow:none}
.page[data-mood="night"]{--bg:#1D1424; --card:#291D33; --ink:#F6EEF8; --ink2:#BCA9C8; --taupe:#7E6B8B; --terra:#C9A7FF; --apricot:#6B4A99;
  --edge:rgba(255,255,255,.09); --rule:rgba(255,255,255,.028); --soft:rgba(255,255,255,.07); --hl:#5C3D8C; --blend:screen;
  --glow:radial-gradient(260px 220px at 78% 12%, rgba(201,167,255,.22), transparent 70%), radial-gradient(420px 300px at 50% 105%, rgba(201,167,255,.10), transparent 70%);
  --shadow:rgba(0,0,0,.5)}
.page[data-mood="night"] .companion{filter:drop-shadow(0 0 22px rgba(201,167,255,.35))}
.page[data-mood="night"] .tile[aria-checked="true"]{box-shadow:0 0 0 1px var(--terra), 0 0 28px -6px rgba(201,167,255,.55)}
.page[data-mood="night"] .btn{background:var(--terra); color:#1D1424; box-shadow:0 8px 30px -10px rgba(201,167,255,.7)}
.page[data-mood="night"] .day[aria-checked="true"]{background:var(--terra); border-color:var(--terra); color:#1D1424}
.page[data-mood="night"] .bell[aria-checked="true"] .plate{fill:var(--terra)}
.page[data-mood="night"] .wk i.on{background:var(--terra)}

.page[data-mood="pop"]{--bg:#C2714F; --card:color-mix(in srgb, var(--bg) 78%, #fff); --ink:#2A1F19; --ink2:#4A3A30; --taupe:#6E5A4D;
  --terra:#2A1F19; --edge:rgba(42,31,25,.16); --rule:transparent; --soft:rgba(42,31,25,.1);
  --hl:color-mix(in srgb, var(--bg) 80%, #5A2A10); --ts:40px; --tls:-.045em}
.page[data-mood="pop"][data-step="1"]{--bg:#E8C05F}
.page[data-mood="pop"][data-step="2"]{--bg:#EDE3D6}
.page[data-mood="pop"][data-step="3"]{--bg:#A9647A; --ink:#1F1418; --ink2:#3A2229}
.page[data-mood="pop"][data-step="4"]{--bg:#E8C05F}
.page[data-mood="pop"][data-step="5"]{--bg:#FBF8F4}
.page[data-mood="pop"][data-step="6"]{--bg:#EDE3D6}
.page[data-mood="pop"] .tile{border-width:2px}

.page[data-mood="calm"]{--bg:#EEF2EA; --card:#FFFFFF; --ink:#2D3A2C; --ink2:#667364; --taupe:#9AA696; --terra:#5F8552; --apricot:#D6E6C2;
  --edge:transparent; --rule:transparent; --soft:#E3E9DD; --hl:#D3E5BD; --tw:700; --tile-r:26px;
  --tile-shadow:0 1px 2px rgba(45,58,44,.06), 0 10px 28px -12px rgba(45,58,44,.18);
  --glow:radial-gradient(500px 360px at 30% -10%, rgba(255,255,255,.7), transparent 70%)}
.page[data-mood="calm"] .tile, .page[data-mood="calm"] .rack, .page[data-mood="calm"] .big, .page[data-mood="calm"] .wkcard, .page[data-mood="calm"] .thumb{border-color:transparent; box-shadow:var(--tile-shadow); border-radius:var(--tile-r)}
.page[data-mood="calm"] .tile[aria-checked="true"]{box-shadow:0 0 0 2px var(--terra), var(--tile-shadow)}
.page[data-mood="calm"] .day{border-color:transparent; background:#fff; box-shadow:var(--tile-shadow)}
.page[data-mood="calm"] .day[aria-checked="true"]{background:var(--terra); color:#fff}
.page[data-mood="calm"] .btn{background:var(--terra)}
.page[data-mood="calm"] .wk i.on{background:var(--terra)}

.page[data-mood="editorial"]{--bg:#F6F4EF; --card:transparent; --ink:#121110; --ink2:#5A5650; --taupe:#9C968D; --terra:#A85A3C;
  --edge:rgba(18,17,16,.16); --rule:transparent; --soft:rgba(18,17,16,.06); --hl:#A85A3C; --hlw:2.4; --blend:normal;
  --f-title:var(--f-serif); --tw:400; --ts:42px; --tls:-.025em; --tile-r:4px}
.page[data-mood="editorial"] .title em{color:var(--terra)}
.page[data-mood="editorial"] .tile, .page[data-mood="editorial"] .thumb, .page[data-mood="editorial"] .day, .page[data-mood="editorial"] .rack, .page[data-mood="editorial"] .big, .page[data-mood="editorial"] .wkcard{border-radius:var(--tile-r)}
.page[data-mood="editorial"] .tile{border-width:1px; background:transparent}
.page[data-mood="editorial"] .tile[aria-checked="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.page[data-mood="editorial"] .btn{border-radius:4px}
.page[data-mood="editorial"] .big .num{font-family:var(--f-serif); font-weight:400}

/* ===== soft mascot rig v2 ===== */
.m{overflow:visible}
.m .rig,.m .pose{transform-box:view-box; transform-origin:100px 178px}
.m .pose{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.m .look{transition:transform .35s ease}
.m .blink{transform-box:fill-box; transform-origin:center}
.m .brow{transform-box:fill-box; transform-origin:center; transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.m .sway{transform-box:view-box; transform-origin:102px 100px}
.m .bob{animation:bob 3.2s ease-in-out infinite}
.m .shadow{transform-box:fill-box; transform-origin:center}
.m .e-shut,.m .e-happy,.m .mo-open,.m .db{opacity:0}
.m .cheek{transition:opacity .3s}
.m .fx>g{opacity:0}
.m .draw{stroke-dasharray:70; stroke-dashoffset:70}
.m .arm{transform:rotate(-40deg) scale(0); opacity:0; transition:transform .45s cubic-bezier(.3,1.5,.5,1), opacity .2s}

      </g></g>

      <path class="e-happy" d="M-6.5 2.5 Q0 -6.5 6.5 2.5" fill="none" stroke="${EYE}" stroke-width="2.8" stroke-linecap="round"/></g>`;
  const cheek = ([x,y]) => `<ellipse class="cheek" cx="${x}" cy="${y}" rx="8.5" ry="5.2" fill="#F09A82" opacity=".5" filter="url(#${u}b3)"/>`;
  const mouth = c.mouth ? `<g transform="translate(${c.mouth[0]} ${c.mouth[1]})">
      <path class="mo-shut" d="M-5.5 -0.5 Q0 4.5 5.5 -0.5" fill="none" stroke="${EYE}" stroke-width="2.4" stroke-linecap="round"/>
      <g class="mo-open"><path d="M-7 -1.5 Q0 -2.5 7 -1.5 Q6 8 0 8.5 Q-6 8 -7 -1.5 Z" fill="#4A2620"/>
        <path d="M-4 5 Q0 2.5 4 5 Q2.5 8 0 8.2 Q-2.5 8 -4 5 Z" fill="#E58A79"/></g></g>` : "";
  const armFill = `url(#${u}arm)`;
  const db = `<g class="db"><rect x="-12" y="34" width="24" height="4" rx="2" fill="#5A4A40"/><rect x="-16" y="27" width="7" height="18" rx="3" fill="${NOSE}"/><rect x="9" y="27" width="7" height="18" rx="3" fill="${NOSE}"/></g>`;
  const arm = (side,[x,y]) => `<g transform="translate(${x} ${y})${side==="l"?" scale(-1 1)":""}"><g class="arm arm-${side}"><rect x="-7.5" y="-4" width="15" height="40" rx="7.5" fill="${armFill}"/>${db}</g></g>`;
  const sway = c.sway ? `<g class="sway">
      <path d="${c.sway.stem}" fill="none" stroke="${T.a[2]}" stroke-width="5" stroke-linecap="round"/>
      ${c.sway.leaves.map(d=>`<path d="${d}" fill="${fill("a")}"/>`).join("")}
      ${c.sway.veins.map(d=>`<path d="${d}" fill="none" stroke="${T.a[0]}" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>`).join("")}</g>` : "";
  const star = c.star ? `<g class="bob"><g transform="translate(152 70)">
      <path d="${c.star}" fill="${fill("s")}"/><circle cx="-3" cy="-3" r="2" fill="#FFFFFF" opacity=".7"/></g></g>` : "";
  const dots = (c.dots||[]).map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${T.b[3]}" opacity=".28"/>`).join("");
  const lines = c.lines.map(l => `<path d="${l.d}" fill="none" stroke="${tone(l.c)}" stroke-width="${l.w}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  const fx = `<g class="fx" fill="none" stroke="var(--terra)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <g class="fx-listen"><path class="draw" d="M30 104 q-9 13 0 26"/><path class="draw" d="M19 97 q-14 20 0 40"/></g>
      <g class="fx-think" fill="var(--terra)" stroke="none"><circle cx="150" cy="66" r="3.4"/><circle cx="164" cy="52" r="4.6"/><circle cx="181" cy="38" r="6"/></g>
      <g class="fx-proud"><path class="draw" d="M150 50 l9 9 l18 -21"/><path class="draw" d="M146 30 l-4 -8"/><path class="draw" d="M186 52 l8 -2"/></g>
      <g class="fx-rest" fill="var(--terra)" stroke="none" font-family="Gochi Hand, cursive"><text x="146" y="74" font-size="18">z</text><text x="160" y="58" font-size="22">z</text><text x="176" y="40" font-size="26">z</text></g>
      <g class="fx-hello" fill="var(--terra)" stroke="none" font-family="Gochi Hand, cursive"><text x="18" y="62" font-size="30">hi</text></g>
      <g class="fx-lift"><path class="draw" d="M22 70 q-6 10 0 20"/><path class="draw" d="M178 70 q6 10 0 20"/></g>
      <g class="fx-comfort" fill="var(--terra)" stroke="none"><path d="M166 64 c-5 -8 -18 -5 -15 5 c2 6 15 13 15 13 s13 -7 15 -13 c3 -10 -10 -13 -15 -5 Z"/></g></g>`;
  return `<svg class="m" viewBox="0 0 200 200" role="img" aria-label="${c.name}">
    <defs>${defs}</defs>
    <ellipse class="shadow" cx="100" cy="181" rx="50" ry="6.5" fill="var(--shadow)" filter="url(#${u}b3)"/>
    <g class="rig"><g class="pose">
      <g data-layer="arms">${arm("l",c.arms[0])}${arm("r",c.arms[1])}</g>
      <g data-layer="back">${c.back.map(shape).join("")}${c.back.length ? `<g clip-path="url(#${u}backclip)"><path d="${c.body}" fill="none" stroke="${T.b[3]}" stroke-width="12" opacity=".26" filter="url(#${u}b3)"/></g>` : ""}</g>
      <g data-layer="body"><path d="${c.body}" fill="${fill("b")}"/>${(c.inner||[]).map(p=>`<g clip-path="url(#${u}clip)">${shape(p)}</g>`).join("")}${volume}${dots}</g>
      ${sway}
      <g data-layer="details">${c.front.map(p => (p.o || p.soft ? "" : `<path d="${p.d}" fill="${T.b[3]}" opacity=".18" transform="translate(0 2.5)" filter="url(#${u}b3)"/>`) + shape(p)).join("")}${lines}</g>
      <g data-layer="face">${c.cheeks.map(cheek).join("")}${c.eyes.map(eye).join("")}${mouth}</g>
    </g></g>${star}${fx}</svg>`;
}

/* ---------- geometry + ink helpers ---------- */
let W = 370, H = 780;
function measure(){
  W = page.clientWidth; H = page.clientHeight;
  page.style.setProperty("--pw", W + "px");
  page.style.setProperty("--cx", Math.round((W - 180) / 2) + "px");
  ink.setAttribute("viewBox", `0 0 ${W} ${H}`); ink.setAttribute("width", W); ink.setAttribute("height", H);
}
new ResizeObserver(measure).observe(page); measure();
function rel(el){ const p = page.getBoundingClientRect(), r = el.getBoundingClientRect(); return {x:r.left-p.left, y:r.top-p.top, w:r.width, h:r.height}; }
function smooth(pts){
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function ringPts(r, pad = 7, turns = 1.12, start = -2.5){
  const cx = r.x + r.w/2, cy = r.y + r.h/2, rx = r.w/2 + pad, ry = r.h/2 + pad, n = 26, pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = start + t * Math.PI * 2 * turns, wob = 1 + Math.sin(t * 9) * 0.018 + t * 0.03;
    pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]);
  }
  return pts;
}
function underPts(r, dy = 6){ const y = r.y + r.h + dy; return [[r.x - 4, y + 2], [r.x + r.w * 0.35, y - 1], [r.x + r.w * 0.7, y + 2], [r.x + r.w + 6, y - 2]]; }
function stroke(d, o = {}){
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  p.setAttribute("stroke", o.color || "var(--terra)");
  p.setAttribute("stroke-width", o.w || 2.4);
  if (o.cls) p.setAttribute("class", o.cls);
  if (o.opacity) p.setAttribute("opacity", o.opacity);
  (o.into || ink).appendChild(p);
  const len = p.getTotalLength();
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
  const a = p.animate([{strokeDashoffset:len}, {strokeDashoffset:0}], {duration: REDUCED ? 1 : (o.dur || 700), delay: REDUCED ? 0 : (o.delay || 0), easing: o.ease || "cubic-bezier(.45,0,.2,1)", fill:"forwards"});
  p.done = a.finished.catch(() => {});
  return p;
}

};

function sceneEl(cls){ const el = document.createElement("section"); el.className = "scene " + cls; return el; }
const gates = new WeakMap();
function gate(el, test){ if (test) gates.set(el, test); const t = gates.get(el), b = el.querySelector("[data-next]"); if (b && t) b.setAttribute("aria-disabled", String(!t())); }

/* ---------- navigation ---------- */
let current = null, busy = false, token = 0;
async function go(n, dir){
  if (busy) return; busy = true;
  const my = token;
  const prev = current;
  if (prev && dir >= 0) await D[V].leave?.(STEPS[S.step]);
  else if (prev) clearInk();
  if (my !== token) return;
  S.step = n; page.dataset.step = n;
  const name = STEPS[n], next = scenes[name]();
  stage.appendChild(next); current = next;
  $("back").classList.toggle("is-hidden", n === 0 || n >= 5);
  $("skip").classList.toggle("is-hidden", n === 0 || n >= 5);
  prog.classList.toggle("is-hidden", n === 0 || n >= 5 || (V !== "thread" && V !== "curve"));
  next.querySelector("[data-next]")?.addEventListener("click", e => { if (e.currentTarget.getAttribute("aria-disabled") !== "true") go(S.step + 1, 1); });
  const settle = () => {
    if (name === "reveal") { next.classList.add("go"); coachState("proud", 1900); D[V].reveal?.(next); }
    else D[V].enter?.(name, next, dir);
    if (name === "stage" || name === "goal" || name === "week") restoreMarks(next, name);
    busy = false;
    const h = next.querySelector("h1,h2"); if (h) { h.tabIndex = -1; h.focus({preventScroll:true}); }
  };
  if (!prev || REDUCED) { prev?.remove(); requestAnimationFrame(settle); return; }
  if (prev.classList.contains("welcome")) prev.querySelector("#cast")?.classList.add("leaving");
  prev.classList.add("turning");
  const fwd = dir >= 0, ease = "cubic-bezier(.22,1,.36,1)";
  prev.style.zIndex = fwd ? 2 : 1; next.style.zIndex = fwd ? 1 : 2;
  prev.animate(fwd ? [{transform:"rotateY(0)", opacity:1}, {transform:"rotateY(-62deg) translateX(-12%)", opacity:0}] : [{transform:"translateX(0)", opacity:1}, {transform:"translateX(14%)", opacity:0}], {duration:640, easing:ease, fill:"forwards"});
  await next.animate(fwd ? [{transform:"translateX(10%)", opacity:0}, {transform:"translateX(0)", opacity:1}] : [{transform:"rotateY(-62deg) translateX(-12%)", opacity:0}, {transform:"rotateY(0)", opacity:1}], {duration:640, delay:fwd ? 80 : 0, easing:ease, fill:"backwards"}).finished.catch(()=>{});
  if (my !== token) return;
  prev.remove(); next.style.zIndex = "";
  settle();
}
/* returning to a scene redraws the marks for choices already made */
function restoreMarks(el, name){
  el.querySelectorAll('[aria-checked="true"]').forEach(b => {
    if (V === "pen" || V === "connect") stroke(smooth(ringPts(rel(b), 6, 1.06, -1.6)), {dur:1, cls:"sel"});
    else if (V === "drawn" && b.matches(".tile")) stroke(smooth(underPts(rel(b.querySelector("b")), hlw() < 5 ? 3 : -3)), {color:"var(--hl)", w:hlw(), dur:1, cls:"pick", opacity:.95});
  });
}
function back(){ if (S.step > 0 && S.step < 5) go(S.step - 1, -1); }

function start(){
  token++; busy = false;
  S = fresh(); current?.remove(); current = null;
  ink.innerHTML = ""; prog.innerHTML = "";
  Object.values(D).forEach(d => { delete d.w; delete d.knotted; delete d.at; d.x = 26; delete d.pen; });
  page.className = "page v-" + V; page.dataset.mood = M;
  host.style.opacity = "1"; comp.querySelector(".outline")?.remove();
  drawCoach(false); coachPos("off");
  try { localStorage.setItem("ss-moods", M); } catch(e) {}
  go(0, 1);
}

/* side list */
const vlist = $("vlist");
vlist.innerHTML = VARIANTS.map((v, i) => `<li><button class="vbtn" type="button" data-v="${v.id}" aria-pressed="${v.id===M}"><span class="sw" aria-hidden="true">${v.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span><b><i>${String.fromCharCode(65+i)}</i>${v.name}</b><span>${v.desc}</span></button></li>`).join("");
vlist.addEventListener("click", e => {
  const b = e.target.closest(".vbtn"); if (!b) return;
  M = b.dataset.v; vlist.querySelectorAll(".vbtn").forEach(x => x.setAttribute("aria-pressed", x === b));
  start();
});
$("replay").addEventListener("click", start);
$("back").addEventListener("click", back);
$("skip").addEventListener("click", () => { if (!S.stage) S.stage = "unsure"; if (!S.goals.length) S.goals = ["strong"]; if (S.days.length < 2) S.days = [0,2,4]; go(5, 1); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { back(); return; }
  if (e.key === "Enter" && current && e.target.tagName !== "BUTTON") {
    const b = current.querySelector("[data-next]");
    if (b && b.getAttribute("aria-disabled") !== "true") { e.preventDefault(); go(S.step + 1, 1); }
  }
});
window.__ob = { get S(){ return S; }, get M(){ return M; }, setM(m){ M = m; start(); } };
start();
})();
</script>
